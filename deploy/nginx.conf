# /etc/nginx/sites-available/monitor-pppoe
# Front estático + proxy de la API (mismo origen, sin CORS).
# TLS autofirmado: generar el par con el comando de monitor-pppoe.md §14.
# Ajustar server_name y las rutas del certificado.

# La app usa CSP estricta. Swagger/Redoc cargan su bundle desde jsDelivr y
# ejecutan un script de inicialización inline: se relaja solo para esas páginas.
map $uri $monitor_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    ~^/api/(docs|redoc)/?$ "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}

server {
    listen 80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.example.com;

    ssl_certificate     /etc/ssl/certs/monitor-pppoe.crt;
    ssl_certificate_key /etc/ssl/private/monitor-pppoe.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/monitor-pppoe/frontend;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $monitor_csp always;

    # SSE: sin buffering y timeouts largos (el stream vive hasta 10 min).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
